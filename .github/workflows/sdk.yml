name: SDKs

# Compile- and test-verification for the client SDKs shipped under sdk/.
#
# These are independent modules the `Go` workflow never touches: the Go SDK
# has its own go.mod (so the root module's ./... patterns exclude it), and
# the C# / Java SDKs are not Go at all. Without this workflow a broken SDK
# commit would ship silently — the C# SDK in particular had no compiler run
# on it anywhere until this job existed.

# Not run on every push/PR: trigger it manually (Actions tab → Run workflow)
# or by pushing a release tag (v*). See docs/TESTING.md "CI Testing".
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  sdk-go:
    name: Go SDK (build + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/go

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to format them."
            exit 1
          fi

      - name: Test
        run: go test ./...

  sdk-csharp:
    name: C# SDK (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/csharp

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.0.2
        with:
          dotnet-version: 8.0.x

      - name: Build
        # Builds NothingDns.sln: the library, the test project and the QuickStart example.
        run: dotnet build

      - name: Test
        # --no-build reuses the Build step's output; the sln includes the test project.
        run: dotnet test --no-build

  sdk-java:
    name: Java SDK (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/java

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -q compile

      - name: Test
        run: mvn -q test

  sdk-python:
    name: Python SDK (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

  sdk-typescript:
    name: TypeScript SDK (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
