# NothingDNS Configuration - Node 1 (Primary/Seed)
server:
  port: 53
  bind:
    - 0.0.0.0
  http:
    enabled: true
    bind: "0.0.0.0:8080"

upstream:
  strategy: round_robin
  servers:
    - 1.1.1.1:53
    - 8.8.8.8:53
    - 8.8.4.4:53
  # The upstream query timeout is `resolution.timeout`; there is no
  # `upstream.timeout` and a key of that name is ignored.
  health_check: 30s

cache:
  enabled: true
  size: 10000
  default_ttl: 3600
  max_ttl: 86400
  min_ttl: 300
  negative_ttl: 60
  prefetch: true
  prefetch_threshold: 60

cluster:
  enabled: true
  node_id: "node-1"
  bind_addr: "172.28.0.10"
  gossip_port: 7946
  region: "default"
  zone: "default"
  weight: 100
  seed_nodes: []
  cache_sync: true

logging:
  level: info
  format: json
  output: stdout

rrl:
  enabled: true
  rate: 100
  burst: 200

dnssec:
  enabled: true

metrics:
  enabled: true
  bind: ":9153"
  path: /metrics

zones:
  - /etc/nothingdns/zones/example.com.zone

# AXFR/IXFR serving is deny-by-default. Add trusted secondary CIDRs here.
transfer:
  allow_list: []
  require_tsig: false
