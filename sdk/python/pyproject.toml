[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nothingdns"
version = "1.0.0"
description = "Typed Python client for the NothingDNS DNS server management API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NothingDNS contributors" }]
keywords = ["dns", "nothingdns", "dns-server", "client", "sdk", "rest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["mypy>=1.8", "ruff>=0.4", "pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/nothingdns/nothingdns"
Documentation = "https://github.com/nothingdns/nothingdns/blob/main/docs/API_REFERENCE.md"
Source = "https://github.com/nothingdns/nothingdns"

[tool.setuptools.packages.find]
include = ["nothingdns*"]

[tool.setuptools.package-data]
nothingdns = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true
